name: Weltdaten aktualisieren

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  WORLD: de258

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: village.txt und unit_info.xml holen
        run: |
          BASE="https://${WORLD}.die-staemme.de"
          curl -fsSL "$BASE/map/village.txt" | awk -F, 'NF>=4 {print $1",,"$3","$4}' > village.txt.new
          test -s village.txt.new && mv village.txt.new village.txt
          curl -fsSL "$BASE/interface.php?func=get_unit_info" -o unit_info.xml.new
          grep -q "<speed>" unit_info.xml.new && mv unit_info.xml.new unit_info.xml
          rm -f *.new
      - name: Änderungen committen
        run: |
          git config user.name "weltdaten-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add village.txt unit_info.xml
          git diff --cached --quiet || git commit -m "Weltdaten ${WORLD} aktualisiert"
          git push
